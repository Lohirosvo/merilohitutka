name: Julkaise merilohitutka
# v15 (13.11.2026): toiminnot Node 24 -versioihin (Node 20 poistettu ajokoneilta 23.9.2026) ja julkaisupaketille
# yrityskohtainen nimi: RE-RUN teki samaan ajoon toisen "github-pages"-paketin ja deploy-pages kaatui
# ("Multiple artifacts named github-pages were unexpectedly found").
# v26 (14.11.2026): sivustoon myös manifest.json ja kuvakkeet (aloitusnäytön sovellus).
# v65b (22.11.2026): julkaisu omaksi työkseen (GitHubin suositus) ja toinen yritys 2 min päästä. Syy: ajot #100/1, #102/1
# ja #102/2 kaatuivat deploy-pagesiin "No artifacts named github-pages-N were found", vaikka paketti oli olemassa
# (#102: github-pages-2, 8,06 MB). Kaatuessa "Re-run failed jobs" ajaa vain julkaisun eikä hae dataa uudelleen (~15 min).
# v71 (22.11.2026): MML_API_KEY (GitHubin salaisuus) hakuvaiheelle: valtion yleinen vesialue MML:n kiinteistöpalvelusta.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"   # 3 tunnin välein (UTC), haetaan uusi Copernicus-data
  workflow_dispatch:          # käsin: Actions -> Julkaise merilohitutka -> Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  kokoa:
    runs-on: ubuntu-latest
    outputs:
      paketti: ${{ steps.nimi.outputs.paketti }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Asenna Copernicus-työkalu
        run: pip install copernicusmarine

      - name: Kokoa sivusto ja ota edellinen data talteen
        run: |
          mkdir -p _site/data
          cp *.html *.js _site/
          # v26 (14.11.2026): aloitusnäytön sovellus tarvitsee myös manifestin ja kuvakkeet (sw.js tulee *.js:n mukana).
          # Puuttuva tiedosto ei estä datan julkaisua, vaan näkyy ajon varoituksena.
          for f in manifest.json icon-192.png icon-512.png icon-192-maskable.png icon-512-maskable.png apple-touch-icon.png favicon-48.png; do
            if [ -f "$f" ]; then cp "$f" _site/; else echo "::warning::puuttuu $f (lataa varaston juureen)"; fi
          done
          curl -sfL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/meri.json" \
            -o _site/data/meri.json || echo "Ei aiempaa dataa"

      - name: Hae Copernicus-data
        continue-on-error: true
        timeout-minutes: 40         # kuusi aluetta noin 8 min; jumiutunut haku ei estä julkaisua
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          MML_API_KEY: ${{ secrets.MML_API_KEY }}   # v71: yleinen vesialue (hae_vesialueet.py); puuttuessa vanha tiedosto käytössä
        run: python hae_copernicus.py _site/data/meri.json

      - uses: actions/configure-pages@v6

      - id: nimi                  # yrityskohtainen nimi; julkaisutyön uusinta käyttää tämän yrityksen pakettia
        run: echo "paketti=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: ${{ steps.nimi.outputs.paketti }}

  julkaise:
    needs: kokoa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.julkaisu.outputs.page_url || steps.julkaisu2.outputs.page_url }}
    steps:
      - id: julkaisu
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.kokoa.outputs.paketti }}

      - name: Odota ennen toista julkaisuyritystä
        if: steps.julkaisu.outcome == 'failure'
        run: sleep 120

      - id: julkaisu2
        if: steps.julkaisu.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.kokoa.outputs.paketti }}
