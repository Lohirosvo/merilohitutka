name: Julkaise merilohitutka
# v15 (13.11.2026): toiminnot Node 24 -versioihin (Node 20 poistettu ajokoneilta 23.9.2026) ja julkaisupaketille
# yrityskohtainen nimi: RE-RUN teki samaan ajoon toisen "github-pages"-paketin ja deploy-pages kaatui
# ("Multiple artifacts named github-pages were unexpectedly found").
# v26 (14.11.2026): sivustoon myös manifest.json ja kuvakkeet (aloitusnäytön sovellus).

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"   # 3 tunnin välein (UTC), haetaan uusi Copernicus-data
  workflow_dispatch:          # käsin: Actions -> Julkaise merilohitutka -> Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  julkaise:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.julkaisu.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Asenna Copernicus-työkalu
        run: pip install copernicusmarine

      - name: Kokoa sivusto ja ota edellinen data talteen
        run: |
          mkdir -p _site/data
          cp *.html *.js _site/
          # v26 (14.11.2026): aloitusnäytön sovellus tarvitsee myös manifestin ja kuvakkeet (sw.js tulee *.js:n mukana).
          # Puuttuva tiedosto ei estä datan julkaisua, vaan näkyy ajon varoituksena.
          for f in manifest.json icon-192.png icon-512.png icon-192-maskable.png icon-512-maskable.png apple-touch-icon.png favicon-48.png; do
            if [ -f "$f" ]; then cp "$f" _site/; else echo "::warning::puuttuu $f (lataa varaston juureen)"; fi
          done
          curl -sfL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/meri.json" \
            -o _site/data/meri.json || echo "Ei aiempaa dataa"

      - name: Hae Copernicus-data
        continue-on-error: true
        timeout-minutes: 40         # kuusi aluetta noin 8 min; jumiutunut haku ei estä julkaisua
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python hae_copernicus.py _site/data/meri.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - id: julkaisu
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
