name: Julkaise merilohitutka

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"   # 3 tunnin välein (UTC), haetaan uusi Copernicus-data
  workflow_dispatch:          # käsin: Actions -> Julkaise merilohitutka -> Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  julkaise:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.julkaisu.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asenna Copernicus-työkalu
        run: pip install copernicusmarine

      - name: Kokoa sivusto ja ota edellinen data talteen
        run: |
          mkdir -p _site/data
          cp *.html *.js _site/
          curl -sfL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/meri.json" \
            -o _site/data/meri.json || echo "Ei aiempaa dataa"

      - name: Hae Copernicus-data
        continue-on-error: true
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python hae_copernicus.py _site/data/meri.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: julkaisu
        uses: actions/deploy-pages@v4
